services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: angela
      POSTGRES_PASSWORD: password
      POSTGRES_DB: holamundo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://angela:password@database:5432/holamundo
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: